name: Playwright Tests

# Ported from care_fe's .github/workflows/playwright.yaml, because this suite is a port of
# care_fe's and drives care_fe itself. Where this differs from the host's workflow, the
# reason is given at the step.
#
# The same four processes docs/how-to/run-the-tests.mdx sets up by hand. The plugin has no
# UI of its own, so a run needs all of them standing up together:
#
#   care backend (:9000)  with care_im_wrapper installed and fixtures loaded
#   care_fe      (:4000)  the host that mounts the federated remote
#   this plugin  (:10120) serving remoteEntry.js, started by Playwright's webServer
#   seeded data           the trigger and two templates the specs file their events under

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

  CARE_REF: develop
  CARE_FE_REF: develop
  PLUGIN_BACKEND_REF: develop

  # Read by playwright.config.ts (baseURL, webServer) and tests/helper/utils.ts.
  REACT_CARE_API_URL: http://localhost:9000
  CARE_FE_URL: http://localhost:4000
  PLUGIN_URL: http://localhost:10120

  # tests/helper/seed.ts, tests/globalSetup.ts and tests/globalTeardown.ts shell into these
  # containers by name. The care checkout directory decides them, so this matches `care/`.
  CARE_BACKEND_CONTAINER: care-backend-1
  CARE_CELERY_CONTAINER: care-celery-1

  # care reads this both when building the image (install_plugins.py) and at runtime
  # (INSTALLED_APPS). The WhatsApp values are placeholders: the plugin's settings refuse to
  # import without them, and the API URL points at a reserved TLD that cannot resolve, so a
  # send that escaped the guards has nowhere to go.
  ADDITIONAL_PLUGS: >-
    [{"name":"care_im_wrapper","package_name":"/app/care_im_wrapper","version":"","configs":{"WHATSAPP_API_URL":"https://graph.invalid/v25.0","WHATSAPP_ACCESS_TOKEN":"ci-placeholder-token","WHATSAPP_PHONE_NUMBER_ID":"ci-placeholder-phone-id","WHATSAPP_BUSINESS_ACCOUNT_ID":"ci-placeholder-waba-id","WHATSAPP_WEBHOOK_VERIFY_TOKEN":"ci-placeholder-verify-token","WHATSAPP_APP_SECRET":"ci-placeholder-app-secret"}}]

  COMPOSE_FILE: docker-compose.yaml:docker-compose.local.yaml

jobs:
  # care_fe shards this three ways behind a paths-filter job and aggregates the shards into
  # a PR comment. Three spec files and eight tests do not earn that, so this is one job.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v5

      - name: Check out care
        uses: actions/checkout@v5
        with:
          repository: ohcnetwork/care
          ref: ${{ env.CARE_REF }}
          path: care

      # The backend half of this plugin. It is what care serves the plugin's API from, and
      # it carries the seed_notification_test_data command the suite seeds and cleans up
      # with. It has to sit inside the care checkout, which becomes /app in the image.
      - name: Check out the plugin backend inside care
        uses: actions/checkout@v5
        with:
          repository: 8sami/care_im_wrapper
          ref: ${{ env.PLUGIN_BACKEND_REF }}
          path: care/care_im_wrapper

      - name: Check out care_fe
        uses: actions/checkout@v5
        with:
          repository: ohcnetwork/care_fe
          ref: ${{ env.CARE_FE_REF }}
          path: care_fe

      # DISABLE_RATELIMIT and the fixed JWKS are what care_fe's workflow writes here, taken
      # from the same committed file; ADDITIONAL_PLUGS is what makes care load this plugin.
      - name: Configure the backend
        working-directory: care
        run: |
          {
            echo "DISABLE_RATELIMIT=True"
            echo "JWKS_BASE64=\"$(cat ../care_fe/.github/runner-files/jwks.b64.txt)\""
            echo "ADDITIONAL_PLUGS=$ADDITIONAL_PLUGS"
          } >> docker/.local.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # care_fe caches the images as tarballs and lets `make up` build them. This builds the
      # image against the GHA layer cache instead, which the plugin's backend workflow
      # already uses; `make up` then finds care_local present and only starts the services.
      - name: Build the care dev image
        uses: docker/build-push-action@v6
        with:
          context: care
          file: care/docker/dev.Dockerfile
          tags: care_local
          load: true
          build-args: ADDITIONAL_PLUGS=${{ env.ADDITIONAL_PLUGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start care and load fixtures
        working-directory: care
        run: make docker_config_file=docker-compose.local.yaml up load-fixtures

      # Non-negotiable, and the reason this job is safe to run at all. The suite creates
      # notification events; care_im_wrapper sweeps pending recipients every ~2 minutes and
      # dispatches them for real, to the real phone numbers in the fixture data.
      # tests/globalSetup.ts asserts this and refuses to start while the worker is up.
      - name: Stop the celery worker
        working-directory: care
        run: docker compose stop celery

      # Templates only ever arrive from the provider, which needs credentials, so without
      # this the three specs have nothing to act on.
      - name: Seed the notification trigger and templates
        working-directory: care
        run: docker compose exec -T backend python manage.py seed_notification_test_data

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            care_fe/package-lock.json

      - name: Build care_fe
        working-directory: care_fe
        env:
          NODE_ENV: production
        run: |
          npm ci --prefer-offline
          npm run build

      # care_fe's own suite starts this through playwright.config.ts webServer. Here the
      # webServer slot belongs to the plugin's preview, so the host is started by hand and
      # waited for. The port is passed explicitly rather than relying on the config default.
      - name: Serve care_fe
        working-directory: care_fe
        run: |
          nohup npm run preview -- --port 4000 > "$RUNNER_TEMP/care_fe-preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sSf "$CARE_FE_URL" > /dev/null; then
              echo "care_fe is answering at $CARE_FE_URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::care_fe did not answer at $CARE_FE_URL within 120s"
          cat "$RUNNER_TEMP/care_fe-preview.log"
          exit 1

      # The suite runs against dist/, so the build is a prerequisite; Playwright's webServer
      # only serves what is already built.
      - name: Build the plugin
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ hashFiles('playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # care_fe runs its setup project as a command of its own, which is why the chromium
      # project declares no dependency on it under CI. Selecting `setup` also runs `auth`,
      # through the dependency edge in playwright.config.ts.
      - name: Run setup projects
        env:
          NODE_ENV: production
        run: npx playwright test --project=setup --workers=1

      # care_fe runs four workers per shard. These specs share one backend's templates and
      # seeded events, so they run serially.
      - name: Run E2E tests
        id: test
        env:
          NODE_ENV: production
        run: npx playwright test --project=chromium --workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            test-results.json
          retention-days: 7

      # tests/globalTeardown.ts already does this after a run that finishes. This is for the
      # runs that do not: a cancelled job or a failure before teardown would otherwise leave
      # recipients behind for the sweep to send the next time a worker starts.
      - name: Clear seeded notification events
        if: always()
        working-directory: care
        run: docker compose exec -T backend python manage.py seed_notification_test_data --reset || true

      - name: Stop care
        if: always()
        working-directory: care
        run: make docker_config_file=docker-compose.local.yaml down || true
